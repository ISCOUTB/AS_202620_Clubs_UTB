name: Backend tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-analyze:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install --only-binary :all: -r requirements.txt # NOSONAR

      - name: Correr pruebas
        working-directory: backend
        env:
          PYTHONPATH: src
          JWT_SECRET: ci-test-secret-key-linkclub-2026 # NOSONAR
        run: pytest tests/ -v