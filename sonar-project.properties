# ==============================================================================
# Configuración de SonarCloud - LinkClub (AS_202620_Clubs_UTB)
# ==============================================================================

# Verifica en SonarCloud (Project Settings -> Information) que estos dos IDs
# coincidan exactamente con los registrados en tu panel:
sonar.organization=iscoutb
sonar.projectKey=ISCOUTB_AS_202620_Clubs_UTB
sonar.projectName=AS_202620_Clubs_UTB

sonar.sourceEncoding=UTF-8

# Rutas de código fuente y pruebas
sonar.sources=backend/src,frontend/linkclub/lib
sonar.tests=backend/tests,frontend/linkclub/test

# Versión objetivo del analizador de Python (alineada con CI y Dockerfile)
sonar.python.version=3.12

# Reportes de cobertura (se cargan automáticamente si los workflows los generan)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.dart.lcov.reportPaths=frontend/linkclub/coverage/lcov.info

# Exclusiones de análisis (código generado, entornos y plantillas nativas)
sonar.exclusions=\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.venv/**,\
  **/venv/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.mocks.dart,\
  frontend/linkclub/build/**,\
  frontend/linkclub/.dart_tool/**,\
  frontend/linkclub/ios/Runner/SceneDelegate.swift,\
  frontend/linkclub/macos/Flutter/GeneratedPluginRegistrant.swift,\
  frontend/linkclub/ios/Runner/GeneratedPluginRegistrant.*,\
  frontend/linkclub/linux/flutter/generated_plugin_registrant.*,\
  frontend/linkclub/windows/flutter/generated_plugin_registrant.*,\
  docs/**

# Evita marcar falsos duplicados entre archivos de pruebas y migraciones
sonar.cpd.exclusions=\
  backend/tests/**,\
  frontend/linkclub/test/**,\
  backend/migrations/**
