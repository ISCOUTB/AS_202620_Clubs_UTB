sonar.sourceEncoding=UTF-8

# Rutas de código fuente y pruebas
sonar.sources=backend/src,frontend/linkclub/lib
sonar.tests=backend/tests,frontend/linkclub/test

# Versión objetivo del analizador de Python
sonar.python.version=3.12

# Exclusiones de archivos generados y plantillas nativas
sonar.exclusions=\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.venv/**,\
  **/venv/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.mocks.dart,\
  frontend/linkclub/build/**,\
  frontend/linkclub/.dart_tool/**,\
  frontend/linkclub/ios/Runner/SceneDelegate.swift,\
  frontend/linkclub/macos/Flutter/GeneratedPluginRegistrant.swift,\
  frontend/linkclub/ios/Runner/GeneratedPluginRegistrant.*,\
  frontend/linkclub/linux/flutter/generated_plugin_registrant.*,\
  frontend/linkclub/windows/flutter/generated_plugin_registrant.*,\
  docs/**

sonar.cpd.exclusions=\
  backend/tests/**,\
  frontend/linkclub/test/**,\
  backend/migrations/**