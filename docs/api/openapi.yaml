openapi: 3.1.0
info:
  title: LinkClub API
  summary: Contrato objetivo de la API de LinkClub (diseño API-first, con backend nativo).
  description: >
    Fuente única de verdad del contrato entre el backend de LinkClub y sus
    consumidores (app Flutter). Cubre las tres personas descritas en el C4 de
    contexto. Se gestiona de forma autónoma sin depender de Supabase.
  version: 1.3.0
  contact:
    name: Equipo LinkClub
    url: https://github.com/ISCOUTB/AS_202620_Clubs_UTB
servers:
  - url: https://api-linkclub.iscoutb.dev
    description: Entorno de Producción (Dokploy)
  - url: http://localhost:8000
    description: Entorno local de desarrollo

tags:
  - name: health
    description: Estado del servicio.
  - name: auth
    description: Registro e inicio de sesión local.
  - name: usuarios
    description: Perfil de usuario.
  - name: clubes
    description: Consulta, búsqueda y creación de clubes.
  - name: membresias
    description: Inscripción y gestión de miembros de un club.
  - name: eventos
    description: Eventos de un club y confirmación de asistencia.
  - name: publicaciones
    description: Avisos, encuestas y noticias de un club.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Estado de salud del backend.
      security: []
      responses:
        "200":
          description: El servicio está operativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/registro:
    post:
      operationId: registrarUsuario
      tags: [auth]
      summary: Registra un usuario nuevo en la plataforma.
      description: >
        Crea la cuenta de forma nativa. El id lo genera el backend. El correo debe ser
        institucional (@utb.edu.co) y la matrícula tener formato T + 7 u 8 dígitos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearUsuarioRequest" }
      responses:
        "201":
          description: Usuario creado exitosamente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "409":
          description: El correo o la matrícula ya están registrados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /auth/login:
    post:
      operationId: iniciarSesion
      tags: [auth]
      summary: Inicia sesión y devuelve un token JWT propio.
      description: Implementa el estándar OAuth2 usando Form Data.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credenciales válidas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /usuarios/me:
    get:
      operationId: obtenerMiPerfil
      tags: [usuarios]
      summary: Perfil del usuario autenticado.
      responses:
        "200":
          description: Perfil del usuario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /clubes:
    get:
      operationId: listarClubes
      tags: [clubes]
      summary: Lista y busca clubes.
      description: Consulta abierta al público (el Estudiante interesado no requiere sesión).
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Búsqueda por nombre o descripción.
        - name: categoria
          in: query
          schema: { type: string }
          description: Filtra por categoría del club.
      responses:
        "200":
          description: Clubes que coinciden con el filtro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Club" }
    post:
      operationId: crearClub
      tags: [clubes]
      summary: Crea un club.
      description: Requiere sesión. Quien lo crea queda como administrador del club.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearClubRequest" }
      responses:
        "201":
          description: Club creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "409":
          description: Ya existe un club con ese nombre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /clubes/{club_id}:
    get:
      operationId: obtenerClub
      tags: [clubes]
      summary: Detalle de un club.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Club encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Club" }
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /clubes/{club_id}/miembros:
    get:
      operationId: listarMiembros
      tags: [membresias]
      summary: Lista los miembros de un club.
      description: >
        Solo el administrador del club puede ver el listado completo de
        miembros (escenario U3 — permisos por rol).
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Miembros del club.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membresia" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
    post:
      operationId: unirseAClub
      tags: [membresias]
      summary: Un estudiante autenticado se inscribe en un club.
      description: Crea una membresía con rol "miembro". Requiere sesión nativa.
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "201":
          description: Membresía creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membresia" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "409":
          description: El usuario ya es miembro de este club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /clubes/{club_id}/eventos:
    get:
      operationId: listarEventosDeClub
      tags: [eventos]
      summary: Lista los eventos de un club.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Eventos del club.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evento" }
    post:
      operationId: crearEvento
      tags: [eventos]
      summary: Publica un nuevo evento del club.
      description: Requiere rol "miembro" o "administrador" en ese club.
      parameters:
        - $ref: "#/components/parameters/ClubId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearEventoRequest" }
      responses:
        "201":
          description: Evento creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evento" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /eventos/{evento_id}:
    get:
      operationId: obtenerEvento
      tags: [eventos]
      summary: Detalle de un evento.
      security: []
      parameters:
        - $ref: "#/components/parameters/EventoId"
      responses:
        "200":
          description: Evento encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evento" }
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /eventos/{evento_id}/asistencia:
    post:
      operationId: confirmarAsistencia
      tags: [eventos]
      summary: Confirma o cancela la asistencia a un evento.
      description: Cualquier usuario autenticado (miembro o interesado) puede confirmar asistencia.
      parameters:
        - $ref: "#/components/parameters/EventoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmarAsistenciaRequest" }
      responses:
        "200":
          description: Estado de asistencia actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asistencia" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /clubes/{club_id}/publicaciones:
    get:
      operationId: listarPublicaciones
      tags: [publicaciones]
      summary: Lista los avisos, encuestas y noticias de un club.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Publicaciones del club.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Publicacion" }
    post:
      operationId: crearPublicacion
      tags: [publicaciones]
      summary: Crea un aviso, una encuesta o una noticia para el club.
      description: Requiere rol "miembro" o "administrador" en ese club.
      parameters:
        - $ref: "#/components/parameters/ClubId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: Llave generada por el cliente para evitar publicaciones duplicadas (S11).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearPublicacionRequest" }
      responses:
        "201":
          description: Publicación creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publicacion" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "409":
          description: Conflicto - Petición bloqueada por Idempotencia para evitar duplicados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /publicaciones/{publicacion_id}:
    get:
      operationId: obtenerPublicacion
      tags: [publicaciones]
      summary: Detalle de una publicación.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicacionId"
      responses:
        "200":
          description: Publicación encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publicacion" }
        "404":
          $ref: "#/components/responses/NoEncontrado"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido nativamente por la API en /auth/login.

  parameters:
    ClubId:
      name: club_id
      in: path
      required: true
      schema: { type: string }
    EventoId:
      name: evento_id
      in: path
      required: true
      schema: { type: string }
    PublicacionId:
      name: publicacion_id
      in: path
      required: true
      schema: { type: string }

  responses:
    NoAutenticado:
      description: Falta un token válido o las credenciales son incorrectas.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SinPermiso:
      description: El usuario autenticado no tiene el rol requerido para esta acción.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DatosInvalidos:
      description: El cuerpo de la petición no cumple las reglas del recurso.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
      additionalProperties: false

    Usuario:
      type: object
      required: [id, nombre, matricula, correo, rol, creado_en]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        matricula: { type: string, example: T00012345 }
        correo: { type: string }
        rol: { type: string, example: estudiante }
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    CrearUsuarioRequest:
      type: object
      required: [nombre, matricula, correo, password]
      properties:
        nombre: { type: string, minLength: 1 }
        matricula: { type: string, pattern: "^T[0-9]{7,8}$" }
        correo: { type: string, description: "Debe terminar en @utb.edu.co." }
        password: { type: string, minLength: 8 }
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: "Correo electrónico del usuario" }
        password: { type: string }
      additionalProperties: false

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
      additionalProperties: false

    AdministradorClub:
      type: object
      required: [usuario_id, nombre]
      properties:
        usuario_id: { type: string }
        nombre: { type: string }
      additionalProperties: false

    CrearClubRequest:
      type: object
      required: [nombre, descripcion, categoria]
      properties:
        nombre: { type: string, minLength: 1 }
        descripcion: { type: string, minLength: 1 }
        categoria: { type: string, minLength: 1 }
        descripcion_completa: { type: [string, "null"] }
        icono: { type: [string, "null"] }
        horario: { type: [string, "null"] }
        lugar: { type: [string, "null"] }
      additionalProperties: false

    Club:
      type: object
      required: [id, nombre, descripcion, categoria, creado_en]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string }
        categoria: { type: string, example: deportes }
        descripcion_completa: { type: [string, "null"] }
        icono: { type: [string, "null"] }
        horario: { type: [string, "null"] }
        lugar: { type: [string, "null"] }
        total_miembros:
          type: integer
          minimum: 0
        administradores:
          type: array
          items: { $ref: "#/components/schemas/AdministradorClub" }
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    Membresia:
      type: object
      required: [id, club_id, usuario_id, rol, creada_en]
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string }
        usuario_id: { type: string }
        rol:
          type: string
          enum: [miembro, administrador]
        creada_en: { type: string, format: date-time }
      additionalProperties: false

    CrearEventoRequest:
      type: object
      required: [titulo, descripcion, fecha_inicio, lugar]
      properties:
        titulo: { type: string, minLength: 1 }
        descripcion: { type: string, minLength: 1 }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: [string, "null"], format: date-time }
        lugar: { type: string, minLength: 1 }
      additionalProperties: false

    Evento:
      type: object
      required: [id, club_id, titulo, descripcion, fecha_inicio, lugar, creado_en]
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string }
        titulo: { type: string }
        descripcion: { type: string }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: [string, "null"], format: date-time }
        lugar: { type: string }
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    ConfirmarAsistenciaRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [confirmado, cancelado]
      additionalProperties: false

    Asistencia:
      type: object
      required: [id, evento_id, usuario_id, estado, actualizado_en]
      properties:
        id: { type: string, format: uuid }
        evento_id: { type: string }
        usuario_id: { type: string }
        estado:
          type: string
          enum: [confirmado, cancelado]
        actualizado_en: { type: string, format: date-time }
      additionalProperties: false

    TipoPublicacion:
      type: string
      enum: [aviso, encuesta, noticia]

    CrearPublicacionRequest:
      type: object
      required: [titulo, contenido]
      properties:
        titulo: { type: string, minLength: 1 }
        contenido: { type: string, minLength: 1 }
        tipo:
          allOf: [{ $ref: "#/components/schemas/TipoPublicacion" }]
          default: aviso
        opciones:
          type: [array, "null"]
          items: { type: string }
      additionalProperties: false
      if:
        properties: { tipo: { const: encuesta } }
        required: [tipo]
      then:
        required: [opciones]
        properties:
          opciones: { type: array, minItems: 1, items: { type: string } }

    Publicacion:
      type: object
      required: [id, club_id, titulo, contenido, tipo, creado_en]
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string }
        autor_id: { type: string }
        titulo: { type: string }
        contenido: { type: string }
        tipo: { $ref: "#/components/schemas/TipoPublicacion" }
        opciones:
          type: [array, "null"]
          items: { type: string }
        creado_en: { type: string, format: date-time }
      additionalProperties: false
