openapi: 3.1.0
info:
  title: LinkClub API
  summary: Contrato de la API de LinkClub (API-first) con backend FastAPI y PostgreSQL propios.
  description: >
    Fuente única de verdad del contrato entre el backend de LinkClub y la aplicación
    móvil Flutter. Cubre los roles Estudiante, Administrador de Club y Superadmin.
    La autenticación y la persistencia son propias del sistema y se despliegan en Dokploy.

    Cada operación declara la extensión x-estado. El valor implementado indica que la
    ruta existe en el backend. El valor pendiente indica que forma parte del diseño
    objetivo y aún no está disponible en el código desplegado.

    Convenciones: toda respuesta de error usa el cuerpo {"detail": "mensaje"}. Las
    lecturas son públicas y toda escritura, salvo registro e inicio de sesión, exige
    un token Bearer. La identidad de un usuario en la API es su matrícula.
  version: 3.1.0
  contact:
    name: Equipo LinkClub
    url: https://github.com/ISCOUTB/AS_202620_Clubs_UTB
servers:
  - url: https://api-linkclub.iscoutb.dev
    description: Producción (Dokploy, servidor del laboratorio)
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: health
    description: Estado del servicio y de su base de datos.
  - name: auth
    description: Registro e inicio de sesión con tokens JWT propios.
  - name: usuarios
    description: Perfil del usuario autenticado y gestión de solicitudes de admin.
  - name: clubes
    description: Consulta, búsqueda, creación y edición de clubes.
  - name: publicaciones
    description: Avisos, encuestas y noticias de los clubes.
  - name: eventos
    description: Programación, consulta y confirmación de asistencia a eventos de clubes.
  - name: recursos
    description: Carga y descarga de imágenes.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Estado del servicio y conectividad con PostgreSQL.
      security: []
      x-estado: implementado
      responses:
        "200":
          description: El servicio y la base de datos están operativos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: La base de datos no está disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/registro:
    post:
      operationId: registrarUsuario
      tags: [auth]
      summary: Registra un usuario nuevo como estudiante o solicitante de admin de club.
      security: []
      x-estado: implementado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearUsuarioRequest" }
      responses:
        "201":
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "409":
          description: El correo o la matrícula ya están registrados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /auth/login:
    post:
      operationId: iniciarSesion
      tags: [auth]
      summary: Inicia sesión (JSON o form-urlencoded) y devuelve un token JWT.
      security: []
      x-estado: implementado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginJsonRequest" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credenciales válidas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          $ref: "#/components/responses/CredencialesInvalidas"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /usuarios/me:
    get:
      operationId: obtenerMiPerfil
      tags: [usuarios]
      summary: Perfil del usuario autenticado.
      x-estado: implementado
      responses:
        "200":
          description: Perfil del usuario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilUsuario" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    patch:
      operationId: actualizarMiPerfil
      tags: [usuarios]
      summary: Actualiza nombre, descripción o foto de perfil del usuario autenticado.
      x-estado: implementado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarPerfilRequest" }
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilUsuario" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    delete:
      operationId: eliminarMiCuenta
      tags: [usuarios]
      summary: Elimina permanentemente la cuenta del usuario autenticado.
      x-estado: implementado
      responses:
        "204":
          description: Cuenta eliminada.
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /usuarios/me/password:
    post:
      operationId: cambiarMiPassword
      tags: [usuarios]
      summary: Cambia la contraseña del usuario autenticado.
      x-estado: implementado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambiarPasswordRequest" }
      responses:
        "204":
          description: Contraseña actualizada.
        "400":
          description: Contraseña actual incorrecta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /admin/solicitudes:
    get:
      operationId: listarSolicitudesAdmin
      tags: [usuarios]
      summary: Lista las solicitudes pendientes de administradores de club (solo SUPERADMIN).
      x-estado: implementado
      responses:
        "200":
          description: Solicitudes pendientes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SolicitudAdmin" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"

  /admin/solicitudes/{solicitud_id}/aprobar:
    post:
      operationId: aprobarSolicitudAdmin
      tags: [usuarios]
      summary: Aprueba una solicitud de administrador de club (solo SUPERADMIN).
      x-estado: implementado
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Solicitud aprobada.
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Esta solicitud ya fue revisada anteriormente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/solicitudes/{solicitud_id}/rechazar:
    post:
      operationId: rechazarSolicitudAdmin
      tags: [usuarios]
      summary: Rechaza una solicitud de administrador de club (solo SUPERADMIN).
      x-estado: implementado
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Solicitud rechazada.
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Esta solicitud ya fue revisada anteriormente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /clubes:
    get:
      operationId: listarClubes
      tags: [clubes]
      summary: Lista y busca clubes.
      security: []
      x-estado: implementado
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: categoria
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Lista de clubes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Club" }
    post:
      operationId: crearClub
      tags: [clubes]
      summary: Crea un club nuevo (solo SUPERADMIN).
      x-estado: implementado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearClubRequest" }
      responses:
        "201":
          description: Club creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "409":
          description: Ya existe un club con ese nombre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /clubes/{club_id}:
    get:
      operationId: obtenerClub
      tags: [clubes]
      summary: Detalle de un club.
      security: []
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Club encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Club" }
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      operationId: actualizarClub
      tags: [clubes]
      summary: Actualiza la ficha pública y enlace de inscripción de un club.
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/ClubId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarClubRequest" }
      responses:
        "200":
          description: Club actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /clubes/{club_id}/publicaciones:
    get:
      operationId: listarPublicacionesDeClub
      tags: [publicaciones]
      summary: Lista las publicaciones de un club.
      security: []
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Publicaciones del club.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Publicacion" }
    post:
      operationId: crearPublicacionDeClub
      tags: [publicaciones]
      summary: Crea un aviso, una encuesta o una noticia en el club indicado en la ruta.
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/ClubId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearPublicacionClubRequest" }
      responses:
        "201":
          description: Publicación creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publicacion" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /publicaciones:
    get:
      operationId: listarFeed
      tags: [publicaciones]
      summary: Feed general con las publicaciones de todos los clubes.
      security: []
      x-estado: implementado
      parameters:
        - name: club_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Publicaciones del feed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Publicacion" }

  /eventos:
    get:
      operationId: listarEventos
      tags: [eventos]
      summary: Lista eventos próximos y pasados visibles para el usuario.
      security:
        - {}
        - bearerAuth: []
      x-estado: implementado
      parameters:
        - name: club_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Lista de eventos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evento" }
    post:
      operationId: crearEvento
      tags: [eventos]
      summary: Programa un evento nuevo para un club (ADMIN_CLUB verificado o SUPERADMIN).
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearEventoRequest" }
      responses:
        "201":
          description: Evento creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evento" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /eventos/{evento_id}/asistencia:
    post:
      operationId: alternarAsistenciaEvento
      tags: [eventos]
      summary: Confirma o cancela la asistencia del usuario autenticado a un evento.
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/EventoId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Estado de asistencia actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsistenciaToggleResponse" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /recursos/upload:
    post:
      operationId: subirImagen
      tags: [recursos]
      summary: Sube una imagen y devuelve su URL pública.
      x-estado: implementado
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Imagen guardada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivoSubido" }
        "400":
          description: Archivo inválido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /static/{archivo}:
    get:
      operationId: descargarImagen
      tags: [recursos]
      summary: Descarga una imagen previamente subida.
      security: []
      x-estado: implementado
      parameters:
        - name: archivo
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Contenido de la imagen.
        "404":
          $ref: "#/components/responses/NoEncontrado"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClubId:
      name: club_id
      in: path
      required: true
      schema: { type: string }
    EventoId:
      name: evento_id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1

  responses:
    NoAutenticado:
      description: Falta el token, es inválido o está vencido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CredencialesInvalidas:
      description: Correo o contraseña incorrectos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SinPermiso:
      description: El usuario autenticado no tiene el rol requerido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NoEncontrado:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DatosInvalidos:
      description: La petición no cumple las reglas de validación.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [online] }
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
      additionalProperties: false

    Usuario:
      type: object
      required: [id, nombre, matricula, correo, creado_en]
      properties:
        id: { type: string }
        nombre: { type: string }
        matricula: { type: string }
        correo: { type: string }
        rol: { type: string }
        verificado: { type: boolean }
        club_administrado_id: { type: [string, "null"] }
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    PerfilUsuario:
      type: object
      required: [matricula, nombre, correo, rol, verificado]
      properties:
        matricula: { type: string }
        nombre: { type: string }
        correo: { type: string }
        rol: { type: string }
        verificado: { type: boolean }
        club_administrado_id: { type: [string, "null"] }
        club_administrado_nombre: { type: [string, "null"] }
        descripcion: { type: [string, "null"] }
        foto_perfil_url: { type: [string, "null"] }
        solicitud_pendiente: { type: boolean }
      additionalProperties: false

    ActualizarPerfilRequest:
      type: object
      properties:
        nombre: { type: [string, "null"], minLength: 1, maxLength: 120 }
        descripcion: { type: [string, "null"], maxLength: 500 }
        foto_perfil_url: { type: [string, "null"] }
      additionalProperties: false

    CambiarPasswordRequest:
      type: object
      required: [password_actual, password_nueva]
      properties:
        password_actual: { type: string }
        password_nueva: { type: string, minLength: 8 }
      additionalProperties: false

    SolicitudAdmin:
      type: object
      required: [id, usuario_matricula, usuario_nombre, usuario_correo, club_id, club_nombre, justificacion, estado, creado_en]
      properties:
        id: { type: string }
        usuario_matricula: { type: string }
        usuario_nombre: { type: string }
        usuario_correo: { type: string }
        club_id: { type: string }
        club_nombre: { type: string }
        justificacion: { type: string }
        estado: { type: string }
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    CrearUsuarioRequest:
      type: object
      required: [nombre, matricula, correo, password]
      properties:
        nombre: { type: string, minLength: 1 }
        matricula: { type: string, pattern: "^T[0-9]{7,8}$" }
        correo: { type: string, pattern: '^[^@\s]+@utb\.edu\.co$' }
        password: { type: string, minLength: 6 }
        solicitar_admin: { type: boolean }
        club_id: { type: [string, "null"] }
        justificacion_admin: { type: [string, "null"] }
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginJsonRequest:
      type: object
      required: [correo, password]
      properties:
        correo: { type: string }
        password: { type: string }

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string }
      additionalProperties: false

    AdministradorClub:
      type: object
      required: [usuario_id, nombre]
      properties:
        usuario_id: { type: string }
        nombre: { type: string }
      additionalProperties: false

    CrearClubRequest:
      type: object
      required: [nombre, descripcion, categoria]
      properties:
        nombre: { type: string, minLength: 1 }
        descripcion: { type: string, minLength: 1 }
        categoria: { type: string, minLength: 1 }
        descripcion_completa: { type: [string, "null"] }
        icono: { type: [string, "null"] }
        logo_url: { type: [string, "null"] }
        horario: { type: [string, "null"] }
        lugar: { type: [string, "null"] }
        lider: { type: [string, "null"] }
        redes_json: { type: [object, "null"] }
        inscripciones_abiertas: { type: boolean }
        ms_forms_url: { type: [string, "null"] }
        aviso_inscripcion: { type: [string, "null"] }
      additionalProperties: false

    ActualizarClubRequest:
      type: object
      properties:
        nombre: { type: [string, "null"], minLength: 1, maxLength: 120 }
        descripcion: { type: [string, "null"], minLength: 1, maxLength: 500 }
        descripcion_completa: { type: [string, "null"] }
        categoria: { type: [string, "null"], minLength: 1, maxLength: 60 }
        icono: { type: [string, "null"] }
        logo_url: { type: [string, "null"] }
        horario: { type: [string, "null"] }
        lugar: { type: [string, "null"] }
        lider: { type: [string, "null"] }
        redes_json: { type: [object, "null"] }
        inscripciones_abiertas: { type: [boolean, "null"] }
        ms_forms_url: { type: [string, "null"] }
        aviso_inscripcion: { type: [string, "null"] }
      additionalProperties: false

    Club:
      type: object
      required: [id, nombre, descripcion, categoria, creado_en]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string }
        categoria: { type: string }
        descripcion_completa: { type: [string, "null"] }
        icono: { type: [string, "null"] }
        logo_url: { type: [string, "null"] }
        horario: { type: [string, "null"] }
        lugar: { type: [string, "null"] }
        lider: { type: [string, "null"] }
        redes_json: { type: object }
        inscripciones_abiertas: { type: boolean }
        ms_forms_url: { type: [string, "null"] }
        aviso_inscripcion: { type: [string, "null"] }
        total_miembros: { type: integer, minimum: 0 }
        administradores:
          type: array
          items: { $ref: "#/components/schemas/AdministradorClub" }
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    TipoPublicacion:
      type: string
      enum: [aviso, encuesta, noticia]

    CrearPublicacionClubRequest:
      type: object
      required: [contenido]
      properties:
        titulo: { type: [string, "null"] }
        contenido: { type: string, minLength: 1 }
        tipo:
          allOf: [{ $ref: "#/components/schemas/TipoPublicacion" }]
          default: aviso
        opciones:
          type: [array, "null"]
          items: { type: string }
        imagen_url: { type: [string, "null"] }
      additionalProperties: false

    Publicacion:
      type: object
      required: [id, club_id, autor_id, titulo, contenido, tipo, creado_en]
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        club_nombre: { type: [string, "null"] }
        autor_id: { type: string }
        autor_nombre: { type: [string, "null"] }
        titulo: { type: string }
