openapi: 3.1.0
info:
  title: LinkClub API
  summary: Contrato de la API de LinkClub (API-first) con backend FastAPI y PostgreSQL propios.
  description: >
    Fuente única de verdad del contrato entre el backend de LinkClub y la aplicación
    móvil Flutter. Cubre las tres personas del C4 de contexto: estudiante interesado,
    miembro de club y administrador de club. La autenticación y la persistencia son
    propias del sistema y se despliegan en Dokploy (ADR 0007).


    Cada operación declara la extensión x-estado. El valor implementado indica que la
    ruta existe en el backend. El valor pendiente indica que forma parte del diseño
    objetivo y aún no está disponible en el código desplegado.


    Convenciones: toda respuesta de error usa el cuerpo {"detail": "mensaje"}. Las
    lecturas son públicas y toda escritura, salvo registro e inicio de sesión, exige
    un token Bearer. La identidad de un usuario en la API es su matrícula.
  version: 3.0.0
  contact:
    name: Equipo LinkClub
    url: https://github.com/ISCOUTB/AS_202620_Clubs_UTB
servers:
  - url: https://api-linkclub.iscoutb.dev
    description: Producción (Dokploy, servidor del laboratorio)
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: health
    description: Estado del servicio y de su base de datos.
  - name: auth
    description: Registro e inicio de sesión con tokens JWT propios.
  - name: usuarios
    description: Perfil del usuario autenticado.
  - name: clubes
    description: Consulta, búsqueda y creación de clubes.
  - name: membresias
    description: Inscripción y gestión de miembros de un club.
  - name: eventos
    description: Eventos de un club y confirmación de asistencia.
  - name: publicaciones
    description: Avisos, encuestas y noticias de los clubes.
  - name: recursos
    description: Carga y descarga de imágenes.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Estado del servicio y conectividad con PostgreSQL.
      description: Ejecuta una consulta de verificación contra la base de datos.
      security: []
      x-estado: implementado
      responses:
        "200":
          description: El servicio y la base de datos están operativos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: La base de datos no está disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/registro:
    post:
      operationId: registrarUsuario
      tags: [auth]
      summary: Registra un usuario nuevo.
      description: >
        Crea la cuenta. El correo debe ser institucional (@utb.edu.co) y la matrícula
        tener formato T seguido de 7 u 8 dígitos. La contraseña se almacena con hash bcrypt.
      security: []
      x-estado: implementado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearUsuarioRequest" }
      responses:
        "201":
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "409":
          description: El correo o la matrícula ya están registrados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /auth/login:
    post:
      operationId: iniciarSesion
      tags: [auth]
      summary: Inicia sesión y devuelve un token JWT.
      description: >
        Implementa el flujo OAuth2 de contraseña con application/x-www-form-urlencoded.
        El campo username recibe el correo institucional. El token usa HS256, contiene
        la matrícula como sujeto y vence a los 7 días por defecto.
      security: []
      x-estado: implementado
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credenciales válidas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          $ref: "#/components/responses/CredencialesInvalidas"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /usuarios/me:
    get:
      operationId: obtenerMiPerfil
      tags: [usuarios]
      summary: Perfil del usuario autenticado.
      description: Devuelve únicamente los datos del usuario identificado por el token.
      x-estado: pendiente
      responses:
        "200":
          description: Perfil del usuario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /clubes:
    get:
      operationId: listarClubes
      tags: [clubes]
      summary: Lista y busca clubes.
      description: >
        Consulta pública. La búsqueda no distingue mayúsculas y compara contra nombre
        y descripción. El filtro de categoría tampoco distingue mayúsculas.
      security: []
      x-estado: implementado
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Texto a buscar en nombre o descripción.
        - name: categoria
          in: query
          required: false
          schema: { type: string }
          description: Categoría exacta del club.
      responses:
        "200":
          description: Clubes que coinciden con los filtros; lista vacía si ninguno coincide.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Club" }
    post:
      operationId: crearClub
      tags: [clubes]
      summary: Crea un club.
      description: Quien lo crea queda como administrador del club.
      x-estado: pendiente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearClubRequest" }
      responses:
        "201":
          description: Club creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "409":
          description: Ya existe un club con ese nombre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /clubes/{club_id}:
    get:
      operationId: obtenerClub
      tags: [clubes]
      summary: Detalle de un club.
      description: Consulta pública de un club por su identificador.
      security: []
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Club encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Club" }
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /clubes/{club_id}/miembros:
    get:
      operationId: listarMiembros
      tags: [membresias]
      summary: Lista los miembros de un club.
      description: Solo el administrador del club puede consultar el listado.
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Miembros del club.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membresia" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    post:
      operationId: unirseAClub
      tags: [membresias]
      summary: El usuario autenticado se inscribe en el club.
      description: Crea una membresía con rol miembro.
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "201":
          description: Membresía creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membresia" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El usuario ya es miembro del club.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /clubes/{club_id}/eventos:
    get:
      operationId: listarEventosDeClub
      tags: [eventos]
      summary: Lista los eventos de un club.
      description: Consulta pública de los eventos asociados al club.
      security: []
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Eventos del club ordenados por fecha de inicio.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evento" }
        "404":
          $ref: "#/components/responses/NoEncontrado"
    post:
      operationId: crearEvento
      tags: [eventos]
      summary: Publica un evento del club.
      description: Requiere rol miembro o administrador en el club.
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/ClubId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearEventoRequest" }
      responses:
        "201":
          description: Evento creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evento" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /eventos/{evento_id}:
    get:
      operationId: obtenerEvento
      tags: [eventos]
      summary: Detalle de un evento.
      description: Consulta pública de un evento por su identificador.
      security: []
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/EventoId"
      responses:
        "200":
          description: Evento encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evento" }
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /eventos/{evento_id}/asistencia:
    post:
      operationId: confirmarAsistencia
      tags: [eventos]
      summary: Confirma o cancela la asistencia a un evento.
      description: Cualquier usuario autenticado puede registrar su asistencia.
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/EventoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmarAsistenciaRequest" }
      responses:
        "200":
          description: Estado de asistencia actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asistencia" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /clubes/{club_id}/publicaciones:
    get:
      operationId: listarPublicacionesDeClub
      tags: [publicaciones]
      summary: Lista las publicaciones de un club.
      description: Consulta pública, de la más reciente a la más antigua.
      security: []
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/ClubId"
      responses:
        "200":
          description: Publicaciones del club.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Publicacion" }
        "404":
          $ref: "#/components/responses/NoEncontrado"
    post:
      operationId: crearPublicacionDeClub
      tags: [publicaciones]
      summary: Crea un aviso, una encuesta o una noticia en el club indicado en la ruta.
      description: >
        El autor se toma siempre del token. El club se toma de la ruta y no se acepta
        club_id en el cuerpo. Si se envía una Idempotency-Key ya usada, la implementación
        vigente devuelve la publicación original sin crear otra. El código 409 describe el
        diseño objetivo para una clave reutilizada con contenido distinto.
      x-estado: implementado
      parameters:
        - $ref: "#/components/parameters/ClubId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearPublicacionClubRequest" }
      responses:
        "201":
          description: Publicación creada, o publicación original si la clave de idempotencia ya existía.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publicacion" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: La clave de idempotencia ya fue usada con un contenido distinto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /publicaciones:
    get:
      operationId: listarFeed
      tags: [publicaciones]
      summary: Feed general con las publicaciones de todos los clubes.
      description: Consulta pública, de la más reciente a la más antigua. Es el origen del feed de la aplicación móvil.
      security: []
      x-estado: pendiente
      responses:
        "200":
          description: Publicaciones con el nombre del autor resuelto.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Publicacion" }
    post:
      operationId: crearPublicacion
      tags: [publicaciones]
      summary: Crea una publicación indicando el club en el cuerpo.
      description: >
        El autor se toma siempre del token. Si se omite club_id, el servidor aplica el
        club por defecto; este comportamiento es transitorio mientras el catálogo de
        clubes no esté persistido y la aplicación móvil no permita elegir club.
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearPublicacionRequest" }
      responses:
        "201":
          description: Publicación creada, o publicación original si la clave de idempotencia ya existía.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publicacion" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: La clave de idempotencia ya fue usada con un contenido distinto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DatosInvalidos"

  /publicaciones/{publicacion_id}:
    get:
      operationId: obtenerPublicacion
      tags: [publicaciones]
      summary: Detalle de una publicación.
      description: Consulta pública de una publicación por su identificador.
      security: []
      x-estado: pendiente
      parameters:
        - $ref: "#/components/parameters/PublicacionId"
      responses:
        "200":
          description: Publicación encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publicacion" }
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /recursos/upload:
    post:
      operationId: subirImagen
      tags: [recursos]
      summary: Sube una imagen y devuelve su URL pública.
      description: >
        Extensiones permitidas: jpg, jpeg, png, webp y gif. El archivo se guarda con un
        nombre UUID en el volumen de la API y se sirve bajo /static.
      x-estado: implementado
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Imagen guardada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivoSubido" }
        "400":
          description: El archivo no tiene nombre o su extensión no está permitida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"
        "500":
          description: Error al escribir el archivo en el volumen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /static/{archivo}:
    get:
      operationId: descargarImagen
      tags: [recursos]
      summary: Descarga una imagen previamente subida.
      description: Archivos servidos desde el volumen de la API. Acceso público para quien conozca la URL.
      security: []
      x-estado: implementado
      parameters:
        - name: archivo
          in: path
          required: true
          schema: { type: string }
          description: Nombre del archivo devuelto por la carga, con su extensión.
      responses:
        "200":
          description: Contenido de la imagen.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NoEncontrado"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por POST /auth/login y firmado con HS256 por la propia API.

  parameters:
    ClubId:
      name: club_id
      in: path
      required: true
      schema: { type: string }
      description: Identificador del club.
    EventoId:
      name: evento_id
      in: path
      required: true
      schema: { type: string }
      description: Identificador del evento.
    PublicacionId:
      name: publicacion_id
      in: path
      required: true
      schema: { type: string }
      description: Identificador de la publicación.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: >
        Clave generada por el cliente, preferiblemente un UUID v4, que evita publicaciones
        duplicadas ante reintentos tras un fallo de red.

  responses:
    NoAutenticado:
      description: Falta el token, es inválido o está vencido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CredencialesInvalidas:
      description: Correo o contraseña incorrectos.
      headers:
        WWW-Authenticate:
          description: Esquema de autenticación requerido.
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SinPermiso:
      description: El usuario autenticado no tiene el rol requerido en el club.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NoEncontrado:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DatosInvalidos:
      description: La petición no cumple las reglas de validación; detail describe el primer error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [online]
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
      additionalProperties: false

    Usuario:
      type: object
      required: [id, nombre, matricula, correo, creado_en]
      properties:
        id:
          type: string
          description: Identidad del usuario; coincide con la matrícula.
          example: T00012345
        nombre: { type: string }
        matricula:
          type: string
          example: T00012345
        correo:
          type: string
          example: estudiante@utb.edu.co
        rol:
          type: string
          example: estudiante
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    CrearUsuarioRequest:
      type: object
      required: [nombre, matricula, correo, password]
      properties:
        nombre:
          type: string
          minLength: 1
        matricula:
          type: string
          pattern: "^T[0-9]{7,8}$"
        correo:
          type: string
          pattern: '^[^@\s]+@utb\.edu\.co$'
        password:
          type: string
          minLength: 8
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Correo institucional del usuario.
        password:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type:
          type: string
          example: bearer
      additionalProperties: false

    AdministradorClub:
      type: object
      required: [usuario_id, nombre]
      properties:
        usuario_id: { type: string }
        nombre: { type: string }
      additionalProperties: false

    CrearClubRequest:
      type: object
      required: [nombre, descripcion, categoria]
      properties:
        nombre: { type: string, minLength: 1 }
        descripcion: { type: string, minLength: 1 }
        categoria: { type: string, minLength: 1 }
        descripcion_completa: { type: [string, "null"] }
        icono: { type: [string, "null"] }
        horario: { type: [string, "null"] }
        lugar: { type: [string, "null"] }
      additionalProperties: false

    Club:
      type: object
      required: [id, nombre, descripcion, categoria, creado_en]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string }
        categoria:
          type: string
          example: Tecnología
        descripcion_completa: { type: [string, "null"] }
        icono: { type: [string, "null"] }
        horario: { type: [string, "null"] }
        lugar: { type: [string, "null"] }
        total_miembros:
          type: integer
          minimum: 0
        administradores:
          type: array
          items: { $ref: "#/components/schemas/AdministradorClub" }
        creado_en: { type: string, format: date-time }
      additionalProperties: false

    Membresia:
      type: object
      required: [id, club_id, usuario_id, rol, creada_en]
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        usuario_id: { type: string }
        rol:
          type: string
          enum: [miembro, administrador]
        creada_en: { type: string, format: date-time }
      additionalProperties: false

    CrearEventoRequest:
      type: object
      required: [titulo, descripcion, fecha_inicio, lugar]
      properties:
        titulo: { type: string, minLength: 1 }
        descripcion: { type: string, minLength: 1 }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: [string, "null"], format: date-time }
        lugar: { type: string, minLength: 1 }
      additionalProperties: false

    Evento:
      type: object
      required: [id, club_id, titulo, descripcion, fecha_inicio, lugar, creado_en]
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        autor_id: { type: string }
        titulo: { type: string }
        descripcion: { type: string }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: [string, "null"], format: date-time }
